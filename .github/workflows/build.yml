name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux script and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check vflasher script
        run: |
          bash -n vflasher
          shellcheck vflasher tests/fake-qdl tests/test-qdl-flash.sh
          ./vflasher --list
      - name: EDL/qdl flashing test (fake board)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdisk mtools zstd
          tests/test-qdl-flash.sh
      - name: Core tests
        run: dotnet test windows/tests/VFlasher.Core.Tests

  windows:
    name: Windows app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      PUBLISH: ${{ github.workspace }}\windows\publish\win-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test windows/tests/VFlasher.Core.Tests
      - name: Publish vflasher.exe
        run: dotnet publish windows/src/VFlasher -c Release -r win-${{ matrix.arch }} -o windows/publish/win-${{ matrix.arch }}
      - name: Fetch qdl and the EDL USB driver
        shell: pwsh
        run: windows/installer/fetch-edl-tools.ps1 -Dest windows/publish/win-${{ matrix.arch }}
      - name: Windows integration tests (virtual disks, driver, qdl, app UI)
        env:
          VFLASHER_EDL_TOOLS: ${{ env.PUBLISH }}
          VFLASHER_EXE: ${{ env.PUBLISH }}\vflasher.exe
        run: dotnet test windows/tests/VFlasher.Windows.Tests --logger "console;verbosity=detailed"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DArch=${{ matrix.arch }} windows\installer\vflasher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: vflasher-windows-${{ matrix.arch }}
          path: |
            windows/publish/win-${{ matrix.arch }}/vflasher.exe
            windows/publish/win-${{ matrix.arch }}/qdl/
            windows/publish/win-${{ matrix.arch }}/drivers/
            windows/publish/vflasher-setup-*.exe
