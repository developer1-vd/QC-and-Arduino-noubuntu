# VFlasher image manifest
# Board: Arduino VENTUNO Q (Qualcomm Dragonwing IQ-8275 / QCS8300 "Monaco", board "Monza")
# OS:    Fedora Server 45 (aarch64, generic UEFI image)
#
# Format: KEY=value, one per line. No shell expansion is performed.

NAME=Fedora Server 45 for Arduino VENTUNO Q
MANUFACTURER=arduino
BOARD=ventuno-q
OS=fedora
OS_VERSION=45
ARCH=aarch64

IMAGE_URL=https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Server/aarch64/images/Fedora-Server-Host-Generic-45-1.4.aarch64.raw.xz
IMAGE_FILE=Fedora-Server-Host-Generic-45-1.4.aarch64.raw.xz
IMAGE_SHA256=c5e3339909ed326480990ec2c0934d19340ff7d5ac9256236966a4e8572752a8
IMAGE_SIZE=1459472356
IMAGE_FORMAT=raw.xz

# The VENTUNO Q boots only from its on-board eMMC, which is written over USB-C
# in Qualcomm EDL mode with qdl. Only the OS partitions at the end of the eMMC
# are replaced; the firmware partitions in front of them are left alone.
FLASH_METHOD=qdl
QDL_STORAGE=emmc
QDL_ESP_PARTITION=efi
QDL_ROOT_PARTITION=system
QDL_ROOT_TYPE=lvm

# Qualcomm's firehose programmer for this board, taken from Arduino's official
# Ubuntu image archive (only its first ~9 MB are downloaded).
QDL_PROGRAMMER_URL=https://people.canonical.com/~platform/images/qualcomm-iot/ventunoq/ubuntu-desktop-24.04/20260729-248/arduino-ventunoq-ubuntu-24.04-desktop-arm64-image-x13-20260729-248.tar.zst
QDL_PROGRAMMER_FORMAT=tar.zst
QDL_PROGRAMMER_PATH=./arduino-ubuntu-monza-20260729-248/flash/prog_firehose_ddr.elf
QDL_PROGRAMMER_SHA256=988460433a60d48891f56dccf2a17556dd57597c188546f46fd6ad920c6df977

EDL_HINT=Fit the EDL jumper with the board unplugged, as in Arduino's VENTUNO Q flashing guide, then plug in USB-C.

# Upstream Linux device tree for this board (shipped in Fedora's kernel package).
# VFlasher makes GRUB load it instead of the firmware's own device tree.
DTB=qcom/monaco-arduino-monza.dtb

FIRST_BOOT=sudo pvresize /dev/disk/by-partlabel/system && sudo lvextend -r -l +100%FREE /dev/systemVG/LVRoot
