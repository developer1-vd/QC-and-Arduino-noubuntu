# VFlasher image manifest
# Board: Qualcomm Dragonwing IQ-9075 EVK (QCS9075 SoC, "lemans" platform)
# OS:    Fedora Workstation 45 (aarch64, GNOME desktop)
#
# Format: KEY=value, one per line. No shell expansion is performed.

NAME=Fedora Workstation 45 (GNOME) for Qualcomm IQ-9075 EVK
MANUFACTURER=qualcomm
BOARD=iq9075-evk
OS=fedora-workstation
OS_VERSION=45
ARCH=aarch64

IMAGE_URL=https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Workstation/aarch64/images/Fedora-Workstation-Disk-45-1.4.aarch64.raw.xz
IMAGE_FILE=Fedora-Workstation-Disk-45-1.4.aarch64.raw.xz
IMAGE_SHA256=07ab3377cee9d4bbc15e7203214594f8cfdb58a9a57e195aa0ff183cf81ea0a8
IMAGE_SIZE=3222363420
IMAGE_FORMAT=raw.xz

# The EVK boots from its on-board UFS, written over USB in Qualcomm EDL mode.
# UFS LUN 0 holds only the OS (efi, persist, system); the firmware is on LUNs
# 1-4 and SPI-NOR and is left alone. LUN 0 uses 4096-byte sectors, so the
# image's FAT EFI partition is rebuilt for that (btrfs root works as is).
FLASH_METHOD=qdl
QDL_STORAGE=ufs
QDL_LAYOUT=whole-lun
QDL_LUN=0
QDL_SECTOR_SIZE=4096

# Qualcomm's firehose programmer for QCS9075/QCS9100, from the Qualcomm Linux
# boot firmware bundle used by the official IQ-9075 EVK flashing instructions.
QDL_PROGRAMMER_URL=https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/ubuntu-fw/QCS9100/QLI.1.8-Ver.1.1/QLI.1.8-Ver.1.1-ubuntu-QCS9100-nhlos-bins.tar.gz
QDL_PROGRAMMER_FORMAT=tar.gz
QDL_PROGRAMMER_PATH=QLI.1.8-Ver.1.1-ubuntu-QCS9100-nhlos-bins/prog_firehose_ddr.elf
QDL_PROGRAMMER_SHA256=39829acee99a898a05bebab8f6da07214bb6816862338907b8fdcd53b0d0cb2e

EDL_HINT=Turn DIP switch SW2-3 on (up), connect the EVK's USB0 (Type-C) port to this computer, then power the board on.

# Upstream Linux device tree for this board (shipped in Fedora's kernel package).
# VFlasher makes GRUB load it instead of the firmware's own device tree.
DTB=qcom/lemans-evk.dtb

# The display is the EVK's two mini DisplayPort connectors (EDP0/EDP1).
